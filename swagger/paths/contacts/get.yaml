tags:
  - Contacts
summary: Get a list of contacts
operationId: getContacts
description: 'Retrieve a list of contacts with optional filtering and pagination'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
    description: 'Page number for pagination (default: 1)'
  - in: query
    name: limit
    schema:
      type: integer
      example: 10
    description: 'Number of contacts per page (default: 10)'
  - in: query
    name: favorite
    schema:
      type: boolean
      example: true
    description: 'Filter contacts by favorite status'
responses:
  '200':
    description: 'Successfully retrieved contacts'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contacts!
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
  '400':
    $ref: ../../components/responses/400.yaml
  '500':
    $ref: ../../components/responses/500.yaml
